{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .login-card { max-width: 420px; margin: 6vh auto; }
    .form-control:focus { box-shadow: none; }
    .brand { font-weight: 700; letter-spacing: .4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-card">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="text-center mb-3">
            <h2 class="brand">YourApp</h2>
            <p class="text-muted mb-0">Sign in to your account</p>
          </div>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}

          {% if errors %}
            <div class="alert alert-danger" role="alert">
              {{ errors }}
            </div>
          {% endif %}

          <form method="post" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <label for="id_email" class="form-label">Email address</label>
              <input type="email" name="email" class="form-control" id="id_email" placeholder="you@example.com" required autofocus>
            </div>

            <div class="mb-3 position-relative">
              <label for="id_password" class="form-label">Password</label>
              <div class="input-group">
                <input type="password" name="password" class="form-control" id="id_password" placeholder="••••••••" required>
                <button type="button" class="btn btn-outline-secondary" id="togglePwd" title="Show password">Show</button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="1" id="id_remember" name="remember">
                  <label class="form-check-label" for="id_remember">Remember me</label>
                </div>
              </div>
              <!-- <div>
                <a href="{% url 'forgot_password' %}" class="small">Forgot password?</a>
              </div> -->
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Sign in</button>
            </div>

          </form>

          <div class="text-center mt-3">
            <small class="text-muted">Don't have an account? <a href="{% url 'register' %}">Register</a></small>
          </div>
        </div>
      </div>

      <div class="text-center mt-3 small text-muted">
        &copy; {{ now|date:"Y" }} YourApp
      </div>
    </div>
  </div>

  <script>
    (function(){
      const toggle = document.getElementById('togglePwd');
      const pwd = document.getElementById('id_password');
      if(toggle && pwd){
        toggle.addEventListener('click', function(){
          if(pwd.type === 'password') { pwd.type = 'text'; toggle.textContent = 'Hide'; }
          else { pwd.type = 'password'; toggle.textContent = 'Show'; }
        });
      }
    })();
  </script>
</body>
</html>
